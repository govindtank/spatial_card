<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#162238" />
      <stop offset="100%" stop-color="#070a12" />
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035" />
      <stop offset="50%" stop-color="#0e1a38" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>
    <linearGradient id="holoSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007a" stop-opacity="0.3" />
      <stop offset="35%" stop-color="#00f0ff" stop-opacity="0.45" />
      <stop offset="65%" stop-color="#ffee58" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00e676" stop-opacity="0.3" />
    </linearGradient>
    <radialGradient id="glareGrad" cx="45%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-10" dy="24" stdDeviation="22" flood-color="#000000" flood-opacity="0.75" />
    </filter>
    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="520" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Glow Behind Card -->
  <circle cx="450" cy="240" r="160" fill="#38bdf8" opacity="0.15" filter="url(#glowEffect)" />

  <!-- 3D Card Group with Perspective Transform -->
  <g transform="translate(450, 240) rotate(-4) skewX(2) skewY(-2) scale(1)">
    <!-- Base Card Body -->
    <rect x="-240" y="-150" width="480" height="300" rx="24" fill="url(#cardGrad)" stroke="#a78bfa" stroke-width="1.5" stroke-opacity="0.4" filter="url(#cardShadow)" />
    
    <!-- Holographic Sheen Layer -->
    <rect x="-240" y="-150" width="480" height="300" rx="24" fill="url(#holoSheen)" opacity="0.7" />
    
    <!-- Specular Glare Reflection -->
    <rect x="-240" y="-150" width="480" height="300" rx="24" fill="url(#glareGrad)" opacity="0.8" />

    <!-- Inner Bevel Stroke -->
    <rect x="-238" y="-148" width="476" height="296" rx="22" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.18" />

    <!-- Depth Layer 1 (Mid): Brand & Header -->
    <text x="-205" y="-105" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="800" letter-spacing="2.5">SPATIAL // HOLOGRAPHIC</text>

    <!-- Depth Layer 2 (High): EMV Metallic Chip -->
    <g transform="translate(150, -125)">
      <rect x="0" y="0" width="56" height="42" rx="8" fill="url(#chipGrad)" stroke="#fef08a" stroke-width="1.2" />
      <line x1="18" y1="0" x2="18" y2="42" stroke="#78350f" stroke-width="1" stroke-opacity="0.7" />
      <line x1="38" y1="0" x2="38" y2="42" stroke="#78350f" stroke-width="1" stroke-opacity="0.7" />
      <line x1="0" y1="21" x2="56" y2="21" stroke="#78350f" stroke-width="1" stroke-opacity="0.7" />
    </g>

    <!-- Depth Layer 2 (High): Card Number -->
    <text x="-205" y="15" fill="#ffffff" font-family="'Courier New', Courier, monospace" font-size="23" font-weight="700" letter-spacing="4">4892  7701  9420  3018</text>

    <!-- Depth Layer 1 (Mid): Cardholder Details -->
    <text x="-205" y="85" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="700" letter-spacing="1.5">CARDHOLDER</text>
    <text x="-205" y="108" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="15" font-weight="700" letter-spacing="1.2">GOVIND TANK</text>

    <!-- Depth Layer 2 (High): Platinum Pill Badge -->
    <g transform="translate(115, 80)">
      <rect x="0" y="0" width="95" height="32" rx="16" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.2" />
      <text x="47.5" y="20" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="800" letter-spacing="1.5" text-anchor="middle">PLATINUM</text>
    </g>
  </g>

  <!-- Feature Annotations on Bottom Bar -->
  <rect x="0" y="460" width="900" height="60" fill="#0b0f19" fill-opacity="0.8" />
  <line x1="0" y1="460" x2="900" y2="460" stroke="#ffffff" stroke-opacity="0.08" />
  <text x="50" y="495" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600">⚡ 120 FPS Pure Flutter &amp; Impeller</text>
  <text x="320" y="495" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600">💎 Multi-Plane Z-Depth Parallax</text>
  <text x="600" y="495" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600">🌈 Prismatic Chromatic Dispersion</text>
</svg>
